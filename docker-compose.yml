# db + backend (spec 001) + frontend (spec 002, D-P13).
# Copy .env.example to .env before starting (C16: no secrets committed).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example to .env)}
      POSTGRES_DB: ${POSTGRES_DB:-inventory_development}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventory}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example to .env)}
      POSTGRES_DB: ${POSTGRES_DB:-inventory_development}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      # Browser-reachable backend URL (D-P14): the host-mapped port, since the
      # browser (not the container) makes the API calls.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - "5173:5173"
    volumes:
      # Bind mount for HMR; the anonymous volume keeps the image's node_modules.
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
